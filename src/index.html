<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escena · Eventos culturales en Madrid</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido</a>

  <header>
    <h1>Escena</h1>
  </header>

  <main id="contenido">

    <section id="vista-inicio" aria-labelledby="titulo-inicio">
      <h2 id="titulo-inicio" tabindex="-1">Próximos eventos</h2>

      <div class="buscador" role="search">
        <label for="buscar">Buscar eventos</label>
        <input id="buscar" type="search" placeholder="Buscar eventos, lugares…" autocomplete="off">
      </div>

      <div class="filtros" role="group" aria-label="Filtrar por categoría">
        <button type="button" class="chip" data-categoria="todos" aria-pressed="true">Todo</button>
        <button type="button" class="chip" data-categoria="teatro" aria-pressed="false">Teatro</button>
        <button type="button" class="chip" data-categoria="musica" aria-pressed="false">Música</button>
        <button type="button" class="chip" data-categoria="cine" aria-pressed="false">Cine</button>
        <button type="button" class="chip" data-categoria="exposicion" aria-pressed="false">Exposiciones</button>
      </div>

      <div class="filtros-extra">
        <div class="campo">
          <label for="filtro-fecha">Fecha</label>
          <select id="filtro-fecha">
            <option value="todas">Cualquier fecha</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-lugar">Lugar</label>
          <select id="filtro-lugar">
            <option value="todos">Todos los lugares</option>
          </select>
        </div>
      </div>

      <p id="resultados" role="status" aria-live="polite"></p>

      <ul id="lista" class="lista-eventos"></ul>
    </section>

    <section id="vista-detalle" aria-labelledby="titulo-detalle" hidden>
      <a class="volver" href="#/">← Volver a los eventos</a>
      <h2 id="titulo-detalle" tabindex="-1">Detalle del evento</h2>
      <div id="detalle-datos"></div>
    </section>

    <section id="vista-lista" aria-labelledby="titulo-lista" hidden>
      <h2 id="titulo-lista" tabindex="-1">Mi lista</h2>
      <p id="lista-vacia">Todavía no has guardado ningún evento.</p>
      <ul id="mi-lista" class="lista-eventos"></ul>
    </section>

  </main>

  <nav class="barra" aria-label="Principal">
    <a href="#/" id="nav-inicio">Inicio</a>
    <a href="#/mi-lista" id="nav-lista">Mi lista (<span id="contador-lista">0</span>)</a>
  </nav>

  <script src="js/eventos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
